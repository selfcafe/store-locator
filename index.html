<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>近くのセルフカフェを探す</title><style>body{margin:0;padding:8px 12px;background:#fff}</style></head><body><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
.scf-loc{--g:#22703d;--g2:#30693e;--lg:#ecf4ee;--line:#d9e3dc;--ink:#101010;--sub:#5b625d;
font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",YuGothic,"Yu Gothic",Meiryo,sans-serif;
color:var(--ink);max-width:1080px;margin:0 auto;line-height:1.6;box-sizing:border-box}
.scf-loc *,.scf-loc *::before,.scf-loc *::after{box-sizing:border-box}
.scf-loc h2{font-size:22px;margin:0 0 4px;color:var(--g);letter-spacing:.04em}
.scf-loc .scf-lead{margin:0 0 16px;color:var(--sub);font-size:14px}
.scf-loc .scf-search{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin-bottom:10px}
.scf-loc .scf-btn{appearance:none;border:0;border-radius:999px;background:var(--g);color:#fff;font:inherit;font-weight:700;
font-size:15px;padding:12px 22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.scf-loc .scf-btn:hover{background:var(--g2)}
.scf-loc .scf-btn:disabled{opacity:.6;cursor:wait}
.scf-loc .scf-form{flex:1 1 300px;display:flex;border:2px solid var(--g);border-radius:999px;overflow:hidden;background:#fff;min-height:48px}
.scf-loc .scf-form input{flex:1;border:0;outline:0;padding:10px 18px;font:inherit;font-size:16px;min-width:0;background:transparent;color:var(--ink)}
.scf-loc .scf-form button{border:0;background:var(--g);color:#fff;font:inherit;font-weight:700;padding:0 20px;cursor:pointer}
.scf-loc .scf-or{align-self:center;color:var(--sub);font-size:13px}
/* 条件から探す（開閉） */
.scf-loc .scf-cond{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
.scf-loc .scf-cond summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:700;color:var(--g);display:flex;align-items:center;gap:10px}
.scf-loc .scf-cond summary::-webkit-details-marker{display:none}
.scf-loc .scf-cond summary::after{content:"＋";margin-left:auto;font-weight:700}
.scf-loc .scf-cond[open] summary::after{content:"－"}
.scf-loc .scf-condsum{font-weight:400;font-size:13px;color:var(--sub)}
.scf-loc .scf-condbody{padding:0 16px 16px;display:grid;gap:12px}
.scf-loc .scf-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:start}
.scf-loc .scf-row > span{font-size:13px;font-weight:700;padding-top:8px}
.scf-loc .scf-selects{display:flex;gap:8px;flex-wrap:wrap}
.scf-loc select{font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:150px;flex:1 1 150px}
.scf-loc .scf-chips{display:flex;flex-wrap:wrap;gap:8px}
.scf-loc .scf-chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.scf-loc .scf-chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
.scf-loc .scf-condacts{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.scf-loc .scf-clear{border:0;background:none;color:var(--sub);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer}
.scf-loc .scf-msg{min-height:1.6em;font-size:14px;color:var(--sub);margin:4px 0 10px}
.scf-loc .scf-msg.err{color:#CF1212}
.scf-loc .scf-cands{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.scf-loc .scf-cands:empty{display:none}
.scf-loc .scf-cands button{border:1px solid var(--g);background:#fff;color:var(--g);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.scf-loc .scf-body{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px}
.scf-loc .scf-map{height:540px;border-radius:12px;border:1px solid var(--line);z-index:0;overflow:hidden}
.scf-loc .scf-list{list-style:none;margin:0;padding:0;max-height:540px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.scf-loc .scf-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer;transition:border-color .15s}
.scf-loc .scf-item:hover,.scf-loc .scf-item.on{border-color:var(--g);box-shadow:0 0 0 1px var(--g) inset}
.scf-loc .scf-top{display:flex;align-items:baseline;gap:8px}
.scf-loc .scf-rank{flex:none;width:24px;height:24px;border-radius:50%;background:var(--g);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.scf-loc .scf-name{font-weight:700;font-size:16px;flex:1}
.scf-loc .scf-dist{flex:none;font-weight:700;color:var(--g);font-size:15px}
.scf-loc .scf-area{flex:none;color:var(--sub);font-size:12px}
.scf-loc .scf-meta{font-size:13px;color:var(--sub);margin:4px 0 0}
.scf-loc .scf-meta b{color:var(--ink);font-weight:500}
.scf-loc .scf-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.scf-loc .scf-tags span{font-size:11px;font-weight:700;color:var(--g);background:var(--lg);border-radius:4px;padding:1px 7px}
.scf-loc .scf-acts{display:flex;gap:8px;margin-top:10px}
.scf-loc .scf-acts a{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:700;border-radius:999px;padding:8px 6px}
.scf-loc .scf-acts .go{background:var(--g);color:#fff}
.scf-loc .scf-acts .pg{border:1px solid var(--g);color:var(--g);background:#fff}
.scf-loc .scf-more{border:1px dashed var(--g);background:var(--lg);color:var(--g);border-radius:12px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
.scf-loc .scf-note{font-size:12px;color:var(--sub);margin-top:10px}
.scf-loc .scf-pin{background:var(--g);color:#fff;border:2px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);width:26px;height:26px;
box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center}
.scf-loc .scf-pin span{transform:rotate(45deg);font-size:11px;font-weight:700}
.scf-loc .scf-pin.dim{background:#8fae98;width:18px;height:18px}
.scf-loc .scf-me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.scf-loc .scf-mk{cursor:pointer}
.scf-loc .maplibregl-popup-content{font-size:13px;line-height:1.5;padding:10px 26px 10px 12px;border-radius:10px}
.scf-loc .maplibregl-popup-content a{color:var(--g);font-weight:700}
.scf-loc .maplibregl-popup-close-button{font-size:18px;width:24px;height:24px}
/* iframe の中: 枠の高さに収め、地図と一覧の部分で高さを分け合う（条件を開いて足りないときは枠の中でスクロール） */
.scf-loc.in-frame{height:calc(100vh - 16px);display:flex;flex-direction:column;overflow:auto}
.scf-loc.in-frame .scf-body{flex:1;min-height:420px}
.scf-loc.in-frame .scf-map{height:100%}
.scf-loc.in-frame .scf-list{max-height:none;height:100%}
.scf-loc.in-frame .scf-note{margin:6px 0 0}
@media (max-width:820px){
.scf-loc .scf-body{grid-template-columns:1fr}
.scf-loc .scf-map{height:300px}
.scf-loc .scf-list{max-height:420px}
.scf-loc .scf-search .scf-btn{width:100%}
.scf-loc .scf-or{display:none}
.scf-loc h2{font-size:19px}
.scf-loc .scf-lead{margin-bottom:10px}
.scf-loc .scf-row{grid-template-columns:1fr;gap:6px}
.scf-loc .scf-row > span{padding-top:0}
.scf-loc .scf-condacts .scf-btn{width:100%}
.scf-loc.in-frame .scf-body{grid-template-rows:240px minmax(0,1fr);gap:10px;min-height:480px}
}
</style>
<div class="scf-loc" id="scf-loc">
<h2>近くのセルフカフェを探す</h2>
<p class="scf-lead">現在地・駅名・店舗名から、またはエリアや設備の条件から店舗を探せます。</p>
<div class="scf-search">
<button type="button" class="scf-btn" data-scf="here">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
現在地から探す
</button>
<span class="scf-or">または</span>
<form class="scf-form" data-scf="form" role="search">
<input type="search" data-scf="q" placeholder="駅名・店舗名を入力" aria-label="駅名・店舗名" enterkeyhint="search">
<button type="submit">検索</button>
</form>
</div>
<details class="scf-cond" data-scf="cond">
<summary>条件から探す <span class="scf-condsum" data-scf="condsum">エリア・設備</span></summary>
<div class="scf-condbody">
<div class="scf-row"><span>エリア</span>
<div class="scf-selects">
<select data-scf="pref" aria-label="都道府県"><option value="">都道府県（すべて）</option></select>
<select data-scf="city" aria-label="市区町村" disabled><option value="">市区町村（すべて）</option></select>
</div>
</div>
<div class="scf-row"><span>設備・サービス</span><div class="scf-chips" data-scf="chips"></div></div>
<div class="scf-condacts">
<button type="button" class="scf-clear" data-scf="clear">すべて解除</button>
<button type="button" class="scf-btn" data-scf="go">この条件で探す（<span data-scf="count">0</span>店舗）</button>
</div>
</div>
</details>
<div class="scf-msg" data-scf="msg" aria-live="polite"></div>
<div class="scf-cands" data-scf="cands"></div>
<div class="scf-body">
<div class="scf-map" data-scf="map"></div>
<ul class="scf-list" data-scf="list"></ul>
</div>
<p class="scf-note">※距離は直線距離の目安です。道順は Google マップで確認できます。</p>
</div>

function fit(pts, maxZoom, pad, duration) {

function esc(s) { return String(s || "").replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function shortName(n) { return n.replace(/^セルフカフェ\s*/, ""); }
function norm(s) { return String(s || "").normalize("NFKC").replace(/\s+/g, "").replace(/ヶ/g, "ケ").toLowerCase(); }
function km(a, b) {
var R = 6371, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
return 2 * R * Math.asin(Math.sqrt(x));
}
function distText(d) { return d < 1 ? Math.round(d * 1000 / 10) * 10 + "m" : (d < 10 ? d.toFixed(1) : Math.round(d)) + "km"; }

// 住所から 都道府県 と 市区町村（政令市は区まで。例: 名古屋市中村区）を取り出す
function areaOf(addr) {
var a = String(addr || "").normalize("NFKC").replace(/^〒?\s*\d{3}-?\d{4}\s*/, "");
var m = a.match(/^(東京都|北海道|京都府|大阪府|.{2,3}?県)(.*)$/);
if (!m) return { pref: "", city: "" };
var r = m[2], c;
// 郡の町村（例: 児玉郡上里町）。「蒲郡市」のように市名に「郡」が入る場合は除く
if ((c = r.match(/^.{1,4}郡(?!市)(.{1,5}?[町村])/))) return { pref: m[1], city: c[1] };
// 市（政令市は区まで。例: 名古屋市中村区）
if ((c = r.match(/^(.+?市)([^0-9\-]{1,4}?区)?/))) return { pref: m[1], city: c[1] + (c[2] || "") };
// 東京23区・町村
c = r.match(/^(.+?[区町村])/);
return { pref: m[1], city: c ? c[1] : "" };
}
function prep(s) {

return s;
}
function tagsOf(s) { return FEATURES.filter(function (f) { return f.has(s); }).map(function (f) { return f.label; }); }
// ピン: 番号なし（全店）は小さい薄緑、検索結果は番号入りの緑
function setPin(i, label) {
var w = markers[i].getElement(), p = w.firstChild;
p.className = "scf-pin" + (label ? "" : " dim");
p.firstChild.textContent = label || "";
w.style.zIndex = label ? 2 : 1;
}
function addMarker(s, i) {
var w = document.createElement("div");
w.className = "scf-mk";
w.title = s.name;
w.innerHTML = '<div class="scf-pin dim"><span></span></div>';
var pop = new maplibregl.Popup({ offset: 24, maxWidth: "260px" });
// 道順のリンクは検索した場所によって変わるので、開くたびに作り直す
pop.on("open", function () { if (openPop && openPop !== pop) openPop.remove(); openPop = pop; pop.setHTML(popup(s)); });
markers[i] = new maplibregl.Marker({ element: w, anchor: "bottom" }).setLngLat([s.lng, s.lat]).setPopup(pop).addTo(map);
}
function popup(s) {
return "<b>" + esc(s.name) + "</b><br>" + esc(s.address) + (s.time ? "<br>営業時間：" + esc(s.time) : "") +
'<br><a href="' + esc(s.url) + '" target="_top">店舗ページ</a>　<a href="' + esc(routeUrl(s)) + '" target="_blank" rel="noopener">道順</a>';
}
// 最新の店舗は HP の店舗案内（REST）から読む。座標は控えと住所が同じなら控えのまま、違えば国土地理院で住所から求める
function plain(h) { var d = new DOMParser().parseFromString(h || "", "text/html"); return (d.body.textContent || "").replace(/\s+/g, " ").trim(); }
function geoQuery(a) {
a = a.normalize("NFKC").replace(/[‐－―ー−]/g, "-");
var m = a.match(/^(.*?\d+(?:-\d+){0,3})/);
return m ? m[1] : a;
}
function geocode(addr) {
var q = geoQuery(addr), key = "scf-geo:" + q;
try { var c = localStorage.getItem(key); if (c) return Promise.resolve(JSON.parse(c)); } catch (e) {}
return getJSON("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(q)).then(function (j) {
if (!j || !j.length) return null;
var p = [j[0].geometry.coordinates[1], j[0].geometry.coordinates[0]];
try { localStorage.setItem(key, JSON.stringify(p)); } catch (e) {}
return p;
}).catch(function () { return null; });
}
function fetchShops(page, acc) {
return fetch(SHOP_API + "&page=" + page).then(function (r) {
if (!r.ok) throw new Error(r.status);
var pages = +r.headers.get("X-WP-TotalPages") || 1;
return r.json().then(function (j) { acc = acc.concat(j); return page < pages ? fetchShops(page + 1, acc) : acc; });
});
}
function latest() {
var byId = {};
SNAP.forEach(function (s) { byId[s.id] = s; });
return fetchShops(1, []).then(function (shops) {
return Promise.all(shops.map(function (s) {
var a = s.acf || {}, st = { id: s.id, name: plain(s.title && s.title.rendered), url: s.link, address: plain(a["shop-address"]),
time: plain(a["shop-time"]), holiday: plain(a["shop-holiday"]), access: plain(a["shop-access"]),
svc: Array.isArray(a["shop-service"]) ? a["shop-service"] : [], parking: plain(a["shop-parking"]) };
if (!st.address) return null;
var old = byId[s.id];
return (old && old.address === st.address ? Promise.resolve([old.lat, old.lng]) : geocode(st.address)).then(function (p) {
if (!p) return null;
st.lat = p[0]; st.lng = p[1];
return st;
});
}));
}).then(function (list) { return list.filter(Boolean); });
}
function sig(list) { return JSON.stringify(list.map(function (s) { return [s.id, s.name, s.url, s.address, s.time, s.holiday, s.svc, s.parking, s.lat, s.lng]; })); }
function setStores(list) {
markers.forEach(function (m) { m.remove(); });
markers = [];
if (openPop) openPop.remove();
STORES = list.map(prep);
STORES.forEach(addMarker);
fillPrefs();
updateCount();
if (last) rerun(true);
else mapLoaded.then(function () { if (STORES.length && !last) fit(STORES.map(function (s) { return [s.lat, s.lng]; }), 15, 20, 0); });
}
// ---- 条件（エリア・設備） ----
FEATURES.forEach(function (f) {
var b = document.createElement("button");
b.type = "button"; b.className = "scf-chip"; b.textContent = f.label; b.setAttribute("aria-pressed", "false");
b.onclick = function () {
picked[f.key] = !picked[f.key];
b.setAttribute("aria-pressed", picked[f.key] ? "true" : "false");
updateCount();
};
$("chips").appendChild(b);
});
function fillPrefs() {
var cur = prefSel.value, have = {};
STORES.forEach(function (s) { have[s.pref] = (have[s.pref] || 0) + 1; });
prefSel.innerHTML = '<option value="">都道府県（すべて）</option>' + PREFS.filter(function (p) { return have[p]; })
.map(function (p) { return '<option value="' + p + '">' + p + "（" + have[p] + "）</option>"; }).join("");
prefSel.value = have[cur] ? cur : "";
fillCities();
}
function fillCities() {
var cur = citySel.value, have = {}, order = [];
STORES.forEach(function (s) {
if (s.pref !== prefSel.value || !s.city) return;
if (!have[s.city]) order.push(s.city);
have[s.city] = (have[s.city] || 0) + 1;
});
order.sort(function (a, b) { return a.localeCompare(b, "ja"); });
citySel.innerHTML = '<option value="">市区町村（すべて）</option>' + order.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + "（" + have[c] + "）</option>"; }).join("");
citySel.disabled = !prefSel.value;
citySel.value = have[cur] ? cur : "";
}
function featOk(s) { return FEATURES.every(function (f) { return !picked[f.key] || f.has(s); }); }
function areaOk(s) { return (!prefSel.value || s.pref === prefSel.value) && (!citySel.value || s.city === citySel.value); }
function pickedLabels() { return FEATURES.filter(function (f) { return picked[f.key]; }).map(function (f) { return f.label; }); }
function updateCount() {
var n = STORES.filter(function (s) { return areaOk(s) && featOk(s); }).length;
$("count").textContent = n;
var parts = [prefSel.value, citySel.value].filter(Boolean).concat(pickedLabels());
$("condsum").textContent = parts.length ? parts.join("・") : "エリア・設備";
}
prefSel.onchange = function () { citySel.value = ""; fillCities(); updateCount(); };
citySel.onchange = updateCount;
$("clear").onclick = function () {
picked = {};
root.querySelectorAll(".scf-chip").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
prefSel.value = ""; fillCities(); updateCount();
};
$("go").onclick = function () { candEl.innerHTML = ""; byCondition(false); condEl.open = false; };
function byCondition(quiet) {
last = { type: "cond" };
origin = null;
if (meMarker) { meMarker.remove(); meMarker = null; }
if (openPop) openPop.remove();
ranked = STORES.map(function (s, i) { return { s: s, i: i, d: null }; }).filter(function (r) { return areaOk(r.s) && featOk(r.s); })
.sort(function (a, b) {
return (PREFS.indexOf(a.s.pref) - PREFS.indexOf(b.s.pref)) || a.s.city.localeCompare(b.s.city, "ja") || shortName(a.s.name).localeCompare(shortName(b.s.name), "ja");
});
if (!quiet) {
shown = PAGE;
var cond = [prefSel.value, citySel.value].filter(Boolean).concat(pickedLabels()).join("・") || "すべての店舗";
if (ranked.length) { fit(ranked.map(function (r) { return [r.s.lat, r.s.lng]; }), 14, 50); say("条件（" + cond + "）に合う店舗：" + ranked.length + "店"); }
else say("条件（" + cond + "）に合う店舗はありませんでした。条件を減らしてお試しください。", true);
}
render();
}
// ---- 一覧 ----
function render() {
listEl.innerHTML = "";
STORES.forEach(function (s, i) { setPin(i, ""); });
ranked.slice(0, shown).forEach(function (r, n) {
var s = r.s, li = document.createElement("li"), tags = tagsOf(s);
li.className = "scf-item";
li.innerHTML =
'<div class="scf-top"><span class="scf-rank">' + (n + 1) + '</span><span class="scf-name">' + esc(shortName(s.name)) + "</span>" +
(r.d != null ? '<span class="scf-dist">' + distText(r.d) + "</span>" : '<span class="scf-area">' + esc(s.city || s.pref) + "</span>") + "</div>" +
'<p class="scf-meta">' + esc(s.address) + "</p>" +
(s.access ? '<p class="scf-meta">' + esc(s.access) + "</p>" : "") +
(s.time ? '<p class="scf-meta"><b>営業時間</b> ' + esc(s.time) + (s.holiday ? "　<b>定休日</b> " + esc(s.holiday) : "") + "</p>" : "") +
(tags.length ? '<div class="scf-tags">' + tags.map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("") + "</div>" : "") +
'<div class="scf-acts"><a class="go" href="' + esc(routeUrl(s)) + '" target="_blank" rel="noopener">道順を見る</a><a class="pg" href="' + esc(s.url) + '" target="_top">店舗ページ</a></div>';
li.addEventListener("click", function (e) {
if (e.target.closest("a")) return;
root.querySelectorAll(".scf-item.on").forEach(function (x) { x.classList.remove("on"); });
li.classList.add("on");
map.easeTo({ center: [s.lng, s.lat], zoom: Math.max(map.getZoom(), 14.5) });
if (!markers[r.i].getPopup().isOpen()) markers[r.i].togglePopup();
});
listEl.appendChild(li);
setPin(r.i, n + 1);
});
if (shown < ranked.length) {
var more = document.createElement("button");
more.type = "button"; more.className = "scf-more"; more.textContent = "もっと見る（残り" + (ranked.length - shown) + "店）";
more.onclick = function () { shown += PAGE; render(); };
var li = document.createElement("li"); li.style.display = "grid"; li.appendChild(more); listEl.appendChild(li);
}
}
// 地点から近い順（設備の条件を選んでいれば、その条件に合う店だけ）
// quiet: 最新の店舗情報で並べ直すだけのとき（地図の位置と案内文は変えない）
function searchFrom(pt, label, quiet) {
last = { type: "point", pt: pt, label: label };
origin = { lat: +pt.lat.toFixed(5), lng: +pt.lng.toFixed(5) };
ranked = STORES.map(function (s, i) { return { s: s, i: i, d: km(origin, s) }; }).filter(function (r) { return featOk(r.s); })
.sort(function (a, b) { return a.d - b.d; });
if (!quiet) shown = PAGE;
if (openPop) openPop.remove();
if (meMarker) meMarker.remove();
var me = document.createElement("div");
me.className = "scf-me"; me.title = label; me.style.zIndex = 3;
meMarker = new maplibregl.Marker({ element: me, anchor: "center" }).setLngLat([origin.lng, origin.lat]).addTo(map);
if (!quiet) {
var near = ranked.slice(0, 3).map(function (r) { return [r.s.lat, r.s.lng]; });
near.push([origin.lat, origin.lng]);
fit(near, 15, 50);
var f = pickedLabels();
say(label + "から近い順に表示しています。" + (f.length ? "（" + f.join("・") + "の店舗のみ）" : "") +
(ranked[0] && ranked[0].d > 30 ? "（近くの店舗は " + distText(ranked[0].d) + " 先です）" : "") +
(ranked.length ? "" : "条件に合う店舗がありません。"));
}
render();
}
function rerun(quiet) {
if (!last) return;
if (last.type === "point") searchFrom(last.pt, last.label, quiet);
else if (last.type === "cond") byCondition(quiet);
}
hereBtn.addEventListener("click", function () {
if (!navigator.geolocation) { say("この端末では現在地を取得できません。駅名・店舗名で検索してください。", true); return; }
hereBtn.disabled = true; candEl.innerHTML = ""; say("現在地を取得しています…");
navigator.geolocation.getCurrentPosition(function (p) {
hereBtn.disabled = false;
ready.then(function () { searchFrom({ lat: p.coords.latitude, lng: p.coords.longitude }, "現在地"); });
}, function (e) {
hereBtn.disabled = false;
say(e.code === 1 ? "位置情報の利用が許可されていません。ブラウザの設定で許可するか、駅名・店舗名で検索してください。" : "現在地を取得できませんでした。駅名・店舗名で検索してください。", true);
}, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
});
// 外部 API が固まっても待ち続けないよう、6 秒で打ち切る（駅検索はもう 1 回だけやり直す）
function getJSON(url, retry) {
var ctl = window.AbortController ? new AbortController() : null, timer = ctl && setTimeout(function () { ctl.abort(); }, 6000);
return fetch(url, ctl ? { signal: ctl.signal } : {}).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
.finally(function () { clearTimeout(timer); })
.catch(function (e) { if (retry) return getJSON(url, retry - 1); throw e; });
}
// 駅名 → HeartRails Express（同名駅は都道府県ごとにまとめ、複数あれば選んでもらう）
function findStation(q) {
var name = q.replace(/駅$/, "");
return getJSON("https://express.heartrails.com/api/json?method=getStations&name=" + encodeURIComponent(name), 1).then(function (j) {
var st = (j.response && j.response.station) || [], seen = {}, out = [];
st.forEach(function (s) {
var k = s.name + "|" + s.prefecture;
if (!seen[k]) { seen[k] = 1; out.push({ label: s.name + "駅（" + s.prefecture + "）", lat: s.y, lng: s.x }); }
});
return out;
}).catch(function () { return []; });
}
// 地名・住所 → 国土地理院 住所検索
function findPlace(q) {
return getJSON("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(q)).then(function (j) {
var seen = {};
return (j || []).filter(function (f) { return !seen[f.properties.title] && (seen[f.properties.title] = 1); }).slice(0, 6)
.map(function (f) { return { label: f.properties.title, lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] }; });
}).catch(function () { return []; });
}
// 店舗名 → 名前に入力した文字を含む店（「セルフカフェ」「店」は無視）
function findStores(q) {
var k = norm(q).replace(/^セルフカフェ/, "").replace(/店$/, "");
if (!k) return [];
// 名前がぴったり → 先頭が一致 → 途中に含む の順
var score = function (s) { var n = norm(shortName(s.name)).replace(/店$/, ""); return n === k ? 0 : n.indexOf(k) === 0 ? 1 : 2; };
return STORES.filter(function (s) { return norm(shortName(s.name)).indexOf(k) >= 0; })
.sort(function (a, b) { return score(a) - score(b); });
}
function storeButton(s) {
var b = document.createElement("button"); b.type = "button"; b.textContent = "店舗：" + shortName(s.name);
b.onclick = function () { searchFrom({ lat: s.lat, lng: s.lng }, shortName(s.name)); };
return b;
}
$("form").addEventListener("submit", function (e) {
e.preventDefault();
var q = input.value.trim();
if (!q) { input.focus(); return; }
input.blur();
say("「" + q + "」を検索しています…"); candEl.innerHTML = "";
ready.then(function () {
var stores = findStores(q);
// 「○○店」と店名で入れたとき、または駅・地名が見つからないときは店舗名を優先
var nameFirst = /店$/.test(q.trim());
return (nameFirst && stores.length ? Promise.resolve([]) : findStation(q).then(function (h) { return h.length ? h : findPlace(q); }))
.then(function (hits) { return { hits: hits, stores: stores }; });
}).then(function (res) {
var hits = res.hits, stores = res.stores;
if (!hits.length && !stores.length) { say("「" + q + "」が見つかりませんでした。駅名・店舗名・市区町村名でお試しください。", true); return; }
if (!hits.length) {
// 店舗名で見つかった: 1 店ならその店の周り、複数なら候補を出す
searchFrom({ lat: stores[0].lat, lng: stores[0].lng }, shortName(stores[0].name));
if (stores.length > 1) {
say("店舗名に「" + q + "」を含む店舗が " + stores.length + " 店あります。" + shortName(stores[0].name) + "から近い順に表示しています：");
stores.slice(1, 10).forEach(function (s) { candEl.appendChild(storeButton(s)); });
}
return;
}
// 候補が複数: 店舗に一番近い候補を先頭に出して選んでもらう
hits.forEach(function (h) { h.near = Math.min.apply(null, STORES.map(function (s) { return km(h, s); })); });
hits.sort(function (a, b) { return a.near - b.near; });
searchFrom(hits[0], hits[0].label);
if (hits.length > 1 || stores.length) {
say(hits[0].label + "から近い順に表示しています。別の場所の場合は選び直してください：");
hits.slice(1, 8).forEach(function (h) {
var b = document.createElement("button"); b.type = "button"; b.textContent = h.label;
b.onclick = function () { searchFrom(h, h.label); };
candEl.appendChild(b);
});
stores.slice(0, 6).forEach(function (s) { candEl.appendChild(storeButton(s)); });
}
});
});
// 店舗の読み込み（控えがあれば即表示し、裏で最新に差し替える）
var ready;
if (SNAP.length) {
setStores(SNAP);
ready = Promise.resolve();
latest().then(function (list) { if (list.length && sig(list) !== sig(STORES)) setStores(list); }).catch(function () {});
} else {
say("店舗情報を読み込んでいます…");
ready = latest().then(function (list) { setStores(list); say(""); })
.catch(function () { say("店舗情報を読み込めませんでした。時間をおいて再度お試しください。", true); throw new Error("load"); });
}
// ?q=駅名 で開くと、その場所で検索した状態で始める（例: 他のページから「梅田で探す」とリンクするとき）
var q0 = new URLSearchParams(location.search).get("q");
if (q0) { input.value = q0; $("form").dispatchEvent(new Event("submit", { cancelable: true })); }
})();
</script></body></html>
